<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>

    <h2>Pages</h2>
    <ul>
        {% for page in pages %}
            <li><a href="{% url page.url_name %}">{{ page.title }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
