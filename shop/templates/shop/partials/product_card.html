<article class="product-card">
    {% if product.image_url %}
        <img src="{{ product.image_url }}" alt="{{ product.name }}">
    {% endif %}
    <h3>{{ product.name }}</h3>
    <p>{{ product.description|truncatewords:18 }}</p>
    <p class="price">{{ product.price }} UAH</p>
    <a class="button" href="{% url 'shop:catalog' %}?category={{ product.category.slug }}">View category</a>
</article>
